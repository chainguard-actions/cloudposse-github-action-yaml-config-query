name: Test basic YAML query
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          query: "."
          config: |
            foo: bar
            baz: qux
      - name: Assert outputs are set
        env:
          FOO: ${{ steps.action.outputs.foo }}
          BAZ: ${{ steps.action.outputs.baz }}
        run: |
          echo "foo: $FOO"
          echo "baz: $BAZ"
          if [ "$FOO" != "bar" ]; then
            echo "FAIL: expected foo='bar', got '$FOO'"
            exit 1
          fi
          if [ "$BAZ" != "qux" ]; then
            echo "FAIL: expected baz='qux', got '$BAZ'"
            exit 1
          fi
          echo "PASS"
